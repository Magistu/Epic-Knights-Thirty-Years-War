plugins {
    id "java-library"
}

archivesBaseName = "epic-knights-thirty-years-war-${rootProject.display_minecraft_version}"

dependencies {
    // We depend on fabric loader here to use the fabric @Environment annotations and get the mixin dependencies
    // Do NOT use other classes from fabric loader
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    // Remove the next line if you don't want to depend on the API

    modApi "dev.architectury:architectury:${rootProject.architectury_version}"
    modApi "me.shedaniel.cloth:cloth-config:${rootProject.cloth_config_version}"
    modImplementation "maven.modrinth:epic-knights-shields-armor-and-weapons:${rootProject.epic_knights_version}"
}

architectury {
    common(rootProject.enabled_platforms.split(","))
}

// Standalone integration check against the actual Minecraft model builders.
tasks.register("verifyGeometry", JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "com.magistuarmory.thirtyyearswar.GeometryVerification"
    args rootProject.file("docs/import-report.json").absolutePath
}

tasks.register("verifyConfig", JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "com.magistuarmory.thirtyyearswar.ConfigVerification"
}
